name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Dependency audit gate (README → Dependency audit). Its own job: it reads
  # only package-lock.json, so it runs before any install (no dependency code
  # can tamper with it), runs once rather than per Node version, and a new
  # advisory doesn't hide the lint/test results below.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/audit.mjs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload coverage report
        # Upload even when thresholds fail, so the report can be inspected.
        if: ${{ !cancelled() && matrix.node == 22 }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
      - run: npm run build
      - run: npm run validate
      # dist/ was built above; skip the rebuild that `test:e2e` does locally.
      - run: npm run test:e2e:run
